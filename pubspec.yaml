name: my_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0' # <--- Ensure this line is exactly like this
dependencies:
  supabase_flutter: ^2.0.0
  flutter:
    sdk: flutter
  
  # UI and Icons
  cupertino_icons: ^1.0.8

  # Networking & Firebase
  http: ^1.2.0
  shared_preferences: ^2.2.2
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  google_sign_in: ^6.1.6
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6

  # Image & File Handling (Moved these to the correct spot!)
  image_picker: ^1.2.1
  url_launcher: ^6.2.5
  flutter_image_compress: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# This is the ONLY top-level flutter block allowed
flutter:
  uses-material-design: true

  # If you need assets later, add them here like this:
  assets:
   - assets/icon.png
   - assets/photo.jfif

# ✅ ADD THIS AT THE VERY BOTTOM (outside flutter:)
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48
